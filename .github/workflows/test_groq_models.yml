name: Check Groq Models

on:
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test Candidate Models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -u -c '
          import os, json, time, urllib.request

          key = os.getenv("GROQ_API_KEY", "")
          candidates = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"]

          for m in candidates:
              print(f"\nTesting model: {m}")
              url = "https://api.groq.com/openai/v1/chat/completions"
              payload = {
                  "model": m,
                  "messages": [
                      {"role": "system", "content": "You are a helpful assistant. Respond with raw JSON only."},
                      {"role": "user", "content": "Generate a JSON object with key title and a story of at least 110 words about space exploration."}
                  ],
                  "temperature": 0.7,
                  "max_tokens": 1024
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {key}",
                      "User-Agent": "Monkey-Baba/1.0"
                  },
                  method="POST"
              )
              t0 = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      res = json.loads(resp.read().decode("utf-8"))
                      text = res["choices"][0]["message"]["content"]
                      el = time.time() - t0
                      print(f"SUCCESS ({m}): Latency={el:.2f}s, Len={len(text.split())} words")
                      print(f"Sample: {text[:150]}")
              except Exception as e:
                  print(f"FAIL ({m}): {e}")
          '
