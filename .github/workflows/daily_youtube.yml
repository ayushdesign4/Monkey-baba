name: Daily Autonomous YouTube Short

on:
  schedule:
    # 21:00 UTC corresponds to 03:00 AM IST (Indian Standard Time, UTC+5:30)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run / simulation mode'
        required: false
        default: 'false'
        type: boolean
      forced_topic:
        description: 'Optional manual topic override'
        required: false
        default: ''
        type: string

concurrency:
  group: monkey-baba-daily
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & System Audio Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monkey-Baba Autonomous Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.forced_topic }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --topic '${{ github.event.inputs.forced_topic }}'"
          fi

          python3 main.py $EXTRA_ARGS

      - name: Commit Updated Topic & Upload Records
        if: always()
        run: |
          git config --global user.name "Monkey-Baba Bot"
          git config --global user.email "bot@monkey-baba.local"
          git add data/topics.json data/uploads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): record daily topic and upload run [skip ci]" && git push)

      - name: Upload Run Media & Logs Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-baba-artifacts-${{ github.run_id }}
          path: output/
          retention-days: 7
