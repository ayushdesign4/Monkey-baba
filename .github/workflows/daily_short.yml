name: Daily YouTube Horror Short

# NOTE: Scheduled cron trigger is temporarily paused for audit & verification.
# To re-enable scheduled production runs at 04:00 AM IST (22:30 UTC), uncomment the schedule block below.
# on:
#   schedule:
#     - cron: "30 22 * * *"
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel preset"
        required: true
        default: "horror"
        type: choice
        options:
          - horror
          - ghost_stories
          - facts
          - hindi_myth
          - school_story
          - psych_tradeoff
          - history_micro
      topic:
        description: "Optional custom story topic (leave empty for automatic selection)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry-run mode (renders video, skips YouTube upload & notification)"
        required: false
        default: true
        type: boolean
      allow_procedural_fallback:
        description: "Allow procedural visual placeholders if AI image generation fails"
        required: false
        default: false
        type: boolean
      privacy:
        description: "YouTube video visibility"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private


concurrency:
  group: monkey-baba-daily-short
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY || secrets.POLLINATIONS_TOKEN }}
      POLLINATIONS_MODEL: "openai/gpt-image-1-mini"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YT_CLIENT_SECRET_VALUE: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      EDGE_TTS_VOICE: "en-US-ChristopherNeural"
      EDGE_TTS_RATE: "+10%"
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -v


      - name: Generate & publish YouTube Short
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'horror' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run != 'false' }}"
          ALLOW_PROC="${{ github.event.inputs.allow_procedural_fallback == 'true' }}"
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"

          CMD="python scripts/run_short.py --channel $CHANNEL --privacy $PRIVACY --run-id $GITHUB_RUN_ID --run-url $GITHUB_RUN_URL"

          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi

          if [ "$ALLOW_PROC" = "true" ]; then
            CMD="$CMD --allow-procedural-fallback"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          else
            CMD="$CMD --upload"
          fi

          echo "Executing: $CMD"
          eval $CMD


      - name: Commit and push updated persistent state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): persist daily short run state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Successfully pushed state update to main."
                break
              fi
              sleep 3
            done
          else
            echo "No state changes to commit."
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ github.run_id }}
          path: |
            output/runs/
            data/run_state.json
          retention-days: 5
