name: Agnes Health Check

on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Agnes API Health and Auth Check
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python -u -c '
          import os, urllib.request, urllib.error, json

          key = os.getenv("AGNES_API_KEY", "")
          print("=" * 60)
          print("AGNES API NON-BILLABLE HEALTH & AUTH CHECK")
          print("=" * 60)
          print(f"Key configured in runner: {bool(key and len(key) > 4)}")

          if not key:
              print("AGNES_API_KEY is not configured or empty.")
              exit(0)

          # Non-billable GET /v1/models call
          url = "https://apihub.agnes-ai.com/v1/models"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "User-Agent": "Monkey-Baba/1.0"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  code = resp.status
                  data = json.loads(resp.read().decode("utf-8"))
                  print(f"HTTP Status: {code}")
                  model_list = [m.get("id") for m in data.get("data", []) if isinstance(m, dict)]
                  print(f"Authentication Verified: True")
                  print(f"Models Count: {len(model_list)}")
                  if model_list:
                      print("Available Models Sample:", model_list[:5])
          except urllib.error.HTTPError as e:
              err_msg = e.read().decode("utf-8", errors="ignore")
              if key in err_msg:
                  err_msg = err_msg.replace(key, "[REDACTED]")
              print(f"HTTP Error: {e.code} ({e.reason})")
              print(f"Error Details: {err_msg[:200]}")
              print("Authentication Verified: False")
          except Exception as e:
              print(f"Network / Connectivity Error: {e}")
              print("Authentication Verified: False")

          print("=" * 60)
          '
